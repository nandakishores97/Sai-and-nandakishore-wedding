      </div>
      <div class="field"><label for="sMessage">Message shown before guests search for their name</label><textarea id="sMessage">${escapeHtml(s.landingMessage || DEFAULT_SETTINGS.landingMessage)}</textarea></div>
      <div class="field"><label for="sSiteUrl">RSVP site link (optional)</label><input type="url" id="sSiteUrl" value="${escapeHtml(s.siteUrl||'')}" placeholder="https://yourname.github.io/wedding-rsvp/"></div>
      <p class="helptext" style="margin-top:-6px">Once this site is hosted, paste its address here. It gets added to the calendar entries guests save, so they can come back and update their RSVP later.</p>
      <div class="field"><label for="sNotifyEmail">Email me when someone RSVPs (optional)</label><input type="email" id="sNotifyEmail" value="${escapeHtml(s.notifyEmail||'')}" placeholder="you@example.com"></div>
      <p class="helptext" style="margin-top:-6px">Sends a summary of each RSVP as it comes in, with running headcounts. Leave blank to turn notifications off.</p>
    </div>
    <div class="card settings-form">
      <h3>Event details</h3>
      <p class="helptext">District is shown to guests while they RSVP. Full venue is only revealed after they submit, and used for the "Get directions" link.</p>
      <div class="row">
        <div class="field"><label for="sWedDate">Wedding date</label><input type="date" id="sWedDate" value="${s.weddingDate}"></div>
        <div class="field"><label for="sWedTime">Wedding time (optional)</label><input type="text" id="sWedTime" value="${escapeHtml(s.weddingTime||'')}"></div>
      </div>
      <div class="row">
        <div class="field"><label for="sWedDistrict">Wedding district (shown pre-RSVP)</label><input type="text" id="sWedDistrict" value="${escapeHtml(s.weddingDistrict||'')}"></div>
        <div class="field"><label for="sWedVenue">Wedding full venue (revealed after RSVP)</label><input type="text" id="sWedVenue" value="${escapeHtml(s.weddingVenue)}"></div>
      </div>
      <div class="row">
        <div class="field"><label for="sRecDate">Reception date</label><input type="date" id="sRecDate" value="${s.receptionDate}"></div>
        <div class="field"><label for="sRecTime">Reception time (optional)</label><input type="text" id="sRecTime" value="${escapeHtml(s.receptionTime||'')}"></div>
      </div>
      <div class="row">
        <div class="field"><label for="sRecDistrict">Reception district (shown pre-RSVP)</label><input type="text" id="sRecDistrict" value="${escapeHtml(s.receptionDistrict||'')}"></div>
        <div class="field"><label for="sRecVenue">Reception full venue (revealed after RSVP)</label><input type="text" id="sRecVenue" value="${escapeHtml(s.receptionVenue)}"></div>
      </div>
      <div class="field"><label for="sPasscode">Change admin passcode (leave blank to keep the current one)</label><input type="text" id="sPasscode" placeholder="New passcode" value=""></div>
      <button class="btn" id="saveSettingsBtn">Save settings</button>
      <div id="settingsSaved" class="helptext"></div>
    </div>
    <div class="card settings-form">
      <h3>Invite images</h3>
      <p class="helptext">Shown to a guest after they RSVP, based on which event they're attending and which side they said they're invited from. Paste the Drive share link for each image (make sure it's set to "Anyone with the link" can view) — this page reads the file ID out of the link automatically, so you don't need to reformat anything. Leave any blank to use the current default image for that event.</p>
      <div class="field"><label for="sWedGroomImg">Wedding invite — groom's side (Drive link)</label><input type="text" id="sWedGroomImg" value="${s.weddingInviteGroomFileId ? escapeHtml('https://drive.google.com/file/d/' + s.weddingInviteGroomFileId + '/view') : ''}"></div>
      <div class="field"><label for="sWedBrideImg">Wedding invite — bride's side (Drive link)</label><input type="text" id="sWedBrideImg" value="${s.weddingInviteBrideFileId ? escapeHtml('https://drive.google.com/file/d/' + s.weddingInviteBrideFileId + '/view') : ''}"></div>
      <div class="field"><label for="sRecGroomImg">Reception invite — groom's side (Drive link)</label><input type="text" id="sRecGroomImg" value="${s.receptionInviteGroomFileId ? escapeHtml('https://drive.google.com/file/d/' + s.receptionInviteGroomFileId + '/view') : ''}"></div>
      <div class="field"><label for="sRecBrideImg">Reception invite — bride's side (Drive link)</label><input type="text" id="sRecBrideImg" value="${s.receptionInviteBrideFileId ? escapeHtml('https://drive.google.com/file/d/' + s.receptionInviteBrideFileId + '/view') : ''}"></div>
      <button class="btn" id="saveImagesBtn">Save images</button>
      <div id="imagesSaved" class="helptext"></div>
    </div>
  `;
  document.getElementById('saveImagesBtn').addEventListener('click', async () => {
    const previous = state.settings;
    // Accepts a full Drive share link, a uc?id= link, or a bare file ID —
    // pulls out just the ID, which is all the backend image proxy needs.
    const extractDriveId = raw => {
      const v = (raw || '').trim();
      if(!v) return '';
      const m = v.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || v.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
      return m ? m[1] : v;
    };
    const newSettings = {
      ...state.settings,
      weddingInviteGroomFileId: extractDriveId(document.getElementById('sWedGroomImg').value),
      weddingInviteBrideFileId: extractDriveId(document.getElementById('sWedBrideImg').value),
      receptionInviteGroomFileId: extractDriveId(document.getElementById('sRecGroomImg').value),
      receptionInviteBrideFileId: extractDriveId(document.getElementById('sRecBrideImg').value)
    };
    // state.settings.passcode is never the real value (the server stops it
    // from ever reaching the client) — it's just DEFAULT_SETTINGS' fallback
    // leaking through the spread above. Strip it so this save can't
    // accidentally overwrite the real passcode with that default.
    delete newSettings.passcode;
    const savedEl = document.getElementById('imagesSaved');
    savedEl.textContent = 'Saving…';
    try{
      await withRetry(() => apiPost({ action: 'saveSettings', settings: newSettings, passcode: state.adminPasscode }));
      state.settings = newSettings;
      savedEl.textContent = 'Saved.';
    }catch(err){
      console.error('Image settings save failed:', err);
      state.settings = previous;
      savedEl.textContent = 'Could not save — please check your connection and try again.';
    }
  });
  document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
    const previous = state.settings;
    const newSettings = {
      ...state.settings,
      coupleNames: document.getElementById('sNames').value.trim() || DEFAULT_SETTINGS.coupleNames,
      groomName: document.getElementById('sGroomName').value.trim() || DEFAULT_SETTINGS.groomName,
      brideName: document.getElementById('sBrideName').value.trim() || DEFAULT_SETTINGS.brideName,
      landingMessage: document.getElementById('sMessage').value.trim() || DEFAULT_SETTINGS.landingMessage,
      siteUrl: document.getElementById('sSiteUrl').value.trim(),
      notifyEmail: document.getElementById('sNotifyEmail').value.trim(),
      // Never let a blank date field wipe a date that's already saved —
      // that's how the dates got cleared before. If the input is empty,
      // keep whatever is currently in settings.
      weddingDate: document.getElementById('sWedDate').value || state.settings.weddingDate,
      weddingTime: document.getElementById('sWedTime').value.trim(),
      weddingDistrict: document.getElementById('sWedDistrict').value.trim(),
      weddingVenue: document.getElementById('sWedVenue').value.trim(),
      receptionDate: document.getElementById('sRecDate').value || state.settings.receptionDate,
      receptionTime: document.getElementById('sRecTime').value.trim(),
      receptionDistrict: document.getElementById('sRecDistrict').value.trim(),
      receptionVenue: document.getElementById('sRecVenue').value.trim()
    };
    // Same reasoning as the images-save handler above: only include
    // 'passcode' in the payload when the admin actually typed a new one —
    // never send the phantom DEFAULT_SETTINGS value that the spread above
    // would otherwise silently include.
    const newPasscode = document.getElementById('sPasscode').value.trim();
    if(newPasscode){ newSettings.passcode = newPasscode; }
    else{ delete newSettings.passcode; }
    const savedEl = document.getElementById('settingsSaved');
    savedEl.textContent = 'Saving…';
    try{
      await withRetry(() => apiPost({ action: 'saveSettings', settings: newSettings, passcode: state.adminPasscode }));
      state.settings = newSettings;
      savedEl.textContent = 'Saved.';
    }catch(err){
      console.error('Settings save failed:', err);
      state.settings = previous;
      savedEl.textContent = 'Could not save — please check your connection and try again.';
    }
  });
}

// ---------- boot ----------
// Render immediately from the built-in defaults so guests see the page at
// once, then fold in the live data when it arrives. Apps Script responses
// routinely take several seconds (cold starts especially), and blocking the
// first paint on that made the site feel broken on slower connections.
(async function boot(){
  if(!state.settings) state.settings = {...DEFAULT_SETTINGS};
  state.view = 'ready';
  state.dataLoading = true;
  const cached = currentRoute() === 'admin' ? null : readPublicCache();
  if(cached){
    state.settings = normaliseDateSettings(Object.assign({}, DEFAULT_SETTINGS, cached.settings));
    state.guestList = cached.guestList;
    state.dataLoading = false; // search works now; fresh data follows below
  }
  const me = currentRoute() === 'admin' ? null : readMe();
  if(me){ state.remembered = me; state.restoringMe = true; }
  render();
  // The guest list and the returning guest's own RSVP load side by side.
  const restoring = me ? restoreRememberedGuest(me) : Promise.resolve(false);
  await loadAll();
  state.dataLoading = false;
  await restoring;
  state.restoringMe = false;
  render();
})();
</script>
</body>
</html>
