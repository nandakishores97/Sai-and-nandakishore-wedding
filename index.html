<style>
  :root{
    --ivory:#FBF7EC;
    --paper:#FFFDF8;
    --gold:#A9791F;
    --gold-text:#805B12; /* gold for small text: passes 4.5:1 on ivory and gold-pale */
    --gold-light:#D4B26A;
    --gold-pale:#EFE2C3;
    --teal:#163832;
    --teal-light:#2B5449;
    --maroon:#7A2331;
    --wedding-tint:#F3E3DE;
    --reception-accent:#1B2A4A;
    --reception-tint:#E6EAF4;
    --ink:#2B241C;
    --ink-soft:#5B5347;
    --line:#E5DBC3;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    font-size:16px;
    line-height:1.5;
    min-height:100vh;
  }
  .kasavu-border{
    height:10px;
    width:100%;
    background:
      repeating-linear-gradient(90deg,
        var(--gold) 0px, var(--gold) 2px,
        transparent 2px, transparent 14px);
    background-color: var(--teal);
    position:relative;
  }
  .kasavu-border.bottom{margin-top:32px;}
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:36px 20px 48px;
  }
  .wrap.wide{max-width:920px;}
  h1,h2,h3{
    font-family:'Cormorant Garamond',serif;
    color:var(--teal);
    margin:0 0 4px;
    font-weight:600;
  }
  h1{font-size:2.4rem;line-height:1.15;text-wrap:balance;}
  h1 .nowrap{white-space:nowrap;}
  input[type=checkbox],input[type=radio]{accent-color:var(--teal);}
  h2{font-size:1.6rem;}
  h3{font-size:1.2rem;margin-bottom:8px;}
  p{margin:0 0 12px;color:var(--ink-soft);}
  .event-dates{
    font-size:0.98rem;
    color:var(--ink-soft);
    margin-bottom:28px;
  }
  .event-dates span{
    display:block;
  }
  .event-dates b{color:var(--teal);font-weight:600;}
  label{
    display:block;
    font-size:0.88rem;
    font-weight:600;
    color:var(--teal);
    margin-bottom:6px;
  }
  input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],textarea,select{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    font-family:inherit;
    font-size:1rem;
    color:var(--ink);
  }
  input:focus,textarea:focus,button:focus,select:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  a:focus-visible,.card.clickable:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  textarea{resize:vertical;min-height:70px;}
  .field{margin-bottom:18px;}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:14px;
  }
  .card.clickable{cursor:pointer;transition:border-color .15s;}
  .card.clickable:hover{border-color:var(--gold);}
  .card.clickable:active{border-color:var(--gold);}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:13px 18px;
    border-radius:10px;
    border:none;
    background:var(--teal);
    color:var(--ivory);
    font-family:inherit;
    font-weight:600;
    font-size:1rem;
    cursor:pointer;
    min-height:46px;
  }
  .btn:hover{background:var(--teal-light);}
  .btn.secondary{
    background:transparent;
    color:var(--teal);
    border:1px solid var(--teal);
  }
  .btn.secondary:hover{background:var(--gold-pale);}
  .btn.small{width:auto;padding:8px 14px;font-size:0.88rem;min-height:36px;}
  .btn.danger{background:var(--maroon);}
  .btn.danger:hover{background:#601a25;}
  .muted-link{
    background:none;border:none;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;font-size:0.9rem;
    font-family:inherit;padding:10px 0;
    min-height:44px;display:inline-flex;align-items:center;
  }
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .checkbox-row{
    display:flex;align-items:center;gap:10px;
    margin-bottom:10px;
  }
  .checkbox-row input{width:20px;height:20px;flex:none;}
  .checkbox-row label{margin:0;color:var(--ink);font-weight:500;}
  .tag{
    display:inline-block;
    font-size:0.75rem;
    font-weight:600;
    color:var(--teal);
    background:var(--gold-pale);
    padding:3px 10px;
    border-radius:100px;
    margin-bottom:8px;
  }
  .tag.maroon{color:#fff;background:var(--maroon);}
  .tag.wedding-tag{background:var(--wedding-tint);color:var(--maroon);}
  .tag.reception-tag{background:var(--reception-tint);color:var(--reception-accent);}
  .tagline{font-size:0.98rem;color:var(--ink-soft);margin-bottom:28px;}
  .hero{text-align:center;}
  .hero .dates{
    font-family:'Cormorant Garamond',serif;
    font-size:1.25rem;
    color:var(--gold-text);
    margin-bottom:6px;
  }
  .countdown{display:flex;justify-content:center;gap:22px;margin:20px 0 30px;}
  .countdown .unit{text-align:center;}
  .countdown .unit .val{
    font-family:'Cormorant Garamond',serif;
    font-size:2.3rem;font-weight:600;color:var(--teal);
    display:block;line-height:1;
  }
  .countdown .unit .lbl{font-size:0.72rem;color:var(--ink-soft);}
  .section-title{
    font-family:'Cormorant Garamond',serif;
    font-size:1.5rem;color:var(--teal);
    text-align:center;margin:6px 0 16px;
  }
  .schedule{margin-bottom:8px;}
  .schedule-card{
    background:var(--paper);border:1px solid var(--line);
    border-top:3px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:14px;text-align:center;
  }
  .schedule-card.wedding{border-top-color:var(--maroon);}
  .schedule-card.reception{border-top-color:var(--reception-accent);}
  .schedule-card .ev-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--teal);margin-bottom:2px;}
  .schedule-card .ev-date{font-weight:600;margin-bottom:2px;}
  .schedule-card .ev-meta{color:var(--ink-soft);font-size:0.88rem;margin-bottom:12px;}
  .map-link{
    display:inline-flex;align-items:center;justify-content:center;
    font-size:0.85rem;font-weight:600;
    color:var(--gold-text);text-decoration:none;
    border:1px solid var(--gold);padding:8px 14px;border-radius:100px;
    background:transparent;font-family:inherit;cursor:pointer;line-height:1.3;
    min-height:44px;
  }
  .map-link:hover{background:var(--gold-pale);}
  .invite-reveal{margin-bottom:20px;text-align:center;}
  .invite-label{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;color:var(--teal);margin-bottom:2px;}
  .invite-sub{font-size:0.82rem;color:var(--ink-soft);margin-bottom:10px;}
  .invites-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start;}
  .invites-row .invite-reveal{flex:1 1 140px;max-width:240px;margin-bottom:20px;min-width:0;}
  .invite-reveal img{width:100%;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:10px;display:block;}
  /* Reserve roughly the invite's portrait shape so the page doesn't jump
     when the artwork arrives. */
  .invite-loading{width:100%;aspect-ratio:5/7;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:10px;color:var(--ink-soft);font-family:'Cormorant Garamond',serif;font-size:1.05rem;background:var(--paper);padding:10px;text-align:center;}
  .invite-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:240px;margin:0 auto;}
  .invite-actions .map-link{width:100%;}
  .invite-extras{display:flex;justify-content:center;flex-wrap:wrap;column-gap:14px;}
  .invite-extras .muted-link{font-size:0.82rem;}
  .confirm-summary{margin:12px 0 0;padding:0;list-style:none;font-size:0.95rem;color:var(--gold-pale);}
  .confirm-summary li{margin:2px 0;}
  .confirm-summary b{color:var(--ivory);font-weight:600;}
  .landing-events{list-style:none;padding:0;margin:0 0 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .landing-events li{display:flex;gap:12px;align-items:baseline;padding:10px 0;font-size:0.95rem;color:var(--ink-soft);}
  .landing-events li + li{border-top:1px solid var(--line);}
  .landing-events .ev{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:var(--teal);min-width:88px;}
  /* Welcome photo: arched frame (a nod to a temple doorway) with a thin gold
     inner line. object-position is tuned per photo so both faces sit in
     the upper-middle of the arch. */
  .couple-photo{
    width:min(62vw,230px);aspect-ratio:4/5;margin:4px auto 22px;
    border-radius:999px 999px 22px 22px;padding:6px;
    background:linear-gradient(160deg,var(--gold-light),var(--gold) 55%,var(--gold-light));
    box-shadow:0 10px 28px -14px rgba(22,56,50,.45);
    position:relative;
  }
  .couple-photo img{
    width:100%;height:100%;display:block;object-fit:cover;object-position:50% 30%;
    border-radius:999px 999px 17px 17px;border:3px solid var(--paper);
    background:var(--gold-pale);opacity:0;transition:opacity .5s ease;
  }
  .couple-photo.loaded img{opacity:1;}
  @media (prefers-reduced-motion: reduce){ .couple-photo img{transition:none;} }
  h1.landing-title{text-align:center;}
  h1.landing-title + p.tagline, h1.landing-title ~ p.tagline{text-align:center;}
  /* Side selector: photo portrait cards */
  .side-pair{display:flex;gap:10px;margin-top:4px;}
  label.side-card{
    flex:1;min-width:0;margin:0;cursor:pointer;text-align:center;position:relative;
    padding:12px 6px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);
    font-weight:400;color:var(--ink);transition:border-color .2s,background-color .2s,opacity .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .side-input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none;}
  .side-card img{width:74px;height:74px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px;
    border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);transition:box-shadow .2s;}
  .side-card small{display:block;font-size:0.78rem;color:var(--ink-soft);}
  .side-card b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.25rem;color:var(--teal);line-height:1.2;overflow-wrap:anywhere;}
  .side-card:hover{border-color:var(--gold-light);}
  .side-card:has(.side-input:checked){border-color:var(--gold);background:var(--gold-pale);}
  .side-card:has(.side-input:checked) img{box-shadow:0 0 0 3px var(--gold);}
  .side-card:has(.side-input:checked)::after{content:'✓';position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:var(--gold-light);font-size:12px;font-weight:700;line-height:22px;}
  .side-pair:has(.side-input:checked) .side-card:not(:has(.side-input:checked)){opacity:.55;}
  .side-card:has(.side-input:focus-visible){outline:2px solid var(--gold);outline-offset:2px;}
  #sideGroup.has-error .side-card{border-color:var(--maroon);}
  @media (prefers-reduced-motion: reduce){ label.side-card,.side-card img{transition:none;} }
  /* Celebration cards: tick to attend, card expands to its details */
  .event-choices{margin:18px 0 6px;}
  .choices-label{margin-bottom:4px;}
  .event-card{
    background:var(--paper);border:1.5px solid var(--line);border-left-width:5px;
    border-radius:var(--radius);margin-bottom:12px;overflow:hidden;
    transition:border-color .2s,box-shadow .2s,opacity .2s;
  }
  .event-card.wedding{border-left-color:var(--maroon);}
  .event-card.reception{border-left-color:var(--reception-accent);}
  .event-card.open{border-color:var(--gold);box-shadow:0 6px 18px -12px rgba(22,56,50,.5);}
  .event-card.wedding.open{border-left-color:var(--maroon);}
  .event-card.reception.open{border-left-color:var(--reception-accent);}
  label.event-head{
    display:flex;gap:14px;align-items:flex-start;margin:0;padding:16px 16px 14px;cursor:pointer;
    font-weight:400;color:var(--ink);-webkit-tap-highlight-color:transparent;
  }
  .event-card.open label.event-head{background:var(--gold-pale);}
  .event-check{width:24px;height:24px;flex:none;margin:2px 0 0;cursor:pointer;}
  .event-text{display:flex;flex-direction:column;min-width:0;}
  .event-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.4rem;color:var(--teal);line-height:1.1;}
  .event-when{font-weight:600;font-size:0.9rem;color:var(--ink);margin-top:3px;}
  .event-time{font-size:0.84rem;color:var(--ink-soft);margin-top:2px;}
  .event-details{padding:14px 16px 6px;border-top:1px solid var(--line);animation:reveal .25s ease;}
  .event-details[hidden]{display:none;}
  @keyframes reveal{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  .event-choices.declined .event-card{opacity:.45;}
  .event-choices.declined label.event-head{cursor:not-allowed;}
  label.decline-card{
    display:flex;gap:12px;align-items:center;margin:4px 0 0;padding:14px 16px;cursor:pointer;
    border:1.5px dashed var(--line);border-radius:var(--radius);background:transparent;
    font-weight:500;color:var(--ink-soft);font-size:0.95rem;
  }
  label.decline-card input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--maroon);}
  label.decline-card.on{border-style:solid;border-color:var(--maroon);background:#F7ECEA;color:var(--maroon);}
  #eventChoices.has-error .event-card, #eventChoices.has-error .decline-card{border-color:var(--maroon);}
  @media (prefers-reduced-motion: reduce){ .event-details{animation:none;} .event-card{transition:none;} }

  /* "Can't find your name?" call to action */
  .manual-cta{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px 0 4px;text-align:center;}
  .manual-cta span{font-size:0.85rem;color:var(--ink-soft);}
  .pill-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;
    padding:10px 22px;border-radius:100px;border:1.5px solid var(--gold);background:var(--gold-pale);
    color:var(--teal);font-family:inherit;font-weight:600;font-size:0.95rem;cursor:pointer;
  }
  .pill-btn:hover{background:#E8D6AE;}

  /* Returning-guest touches */
  .restore-note{display:flex;align-items:center;justify-content:center;gap:4px;font-size:0.9rem;color:var(--teal);
    background:var(--gold-pale);border-radius:100px;padding:8px 14px;margin:-8px 0 20px;}
  .confirm-kicker{font-size:0.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-light);margin-bottom:4px;}
  .confirm-summary li{margin:0 0 12px;}
  .confirm-summary li:last-child{margin-bottom:0;}
  .confirm-summary .names{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:0.92rem;color:var(--ivory);margin:6px 0 0;}
  .confirm-summary .nm{display:inline-flex;align-items:center;gap:8px;}
  .confirm-summary .diet{font-size:0.72rem;font-weight:600;letter-spacing:.02em;padding:1px 8px;border-radius:100px;background:rgba(239,226,195,.16);color:var(--gold-pale);}

  /* Full-screen invite viewer */
  .invite-zoom{display:block;position:relative;width:100%;padding:0;margin:0 0 10px;border:none;background:none;cursor:zoom-in;border-radius:var(--radius);}
  .invite-zoom img{margin:0;}
  .zoom-hint{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;
    background:rgba(22,56,50,.82);color:var(--ivory);font-size:0.72rem;font-weight:600;pointer-events:none;}
  .lightbox{position:fixed;inset:0;z-index:10000;background:rgba(12,20,18,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));animation:lbIn .2s ease;}
  @keyframes lbIn{from{opacity:0}to{opacity:1}}
  .lightbox img{max-width:100%;max-height:calc(100% - 72px);object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:pinch-zoom;}
  .lightbox-bar{display:flex;gap:10px;margin-top:14px;}
  .lightbox-bar button{min-height:44px;padding:10px 20px;border-radius:100px;font-family:inherit;font-weight:600;font-size:0.95rem;cursor:pointer;}
  .lb-close{background:var(--ivory);color:var(--teal);border:none;}
  .lb-save{background:transparent;color:var(--ivory);border:1.5px solid rgba(251,247,236,.6);}
  .lb-x{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(251,247,236,.15);color:var(--ivory);font-size:1.6rem;line-height:1;cursor:pointer;}
  @media (prefers-reduced-motion: reduce){ .lightbox{animation:none;} }
  .btn.edit-btn{margin-top:16px;background:var(--ivory);color:var(--teal);width:auto;padding:11px 26px;}
  .btn.edit-btn:hover{background:var(--gold-pale);}
  .field-error{color:var(--maroon);font-size:0.86rem;font-weight:500;margin:6px 0 10px;}
  .has-error input,.has-error select,input.has-error{border-color:var(--maroon);}

  .spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--gold-pale);border-top-color:var(--gold);animation:spin 0.8s linear infinite;}
  .spinner-sm{width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:-2px;margin-right:7px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:80px 20px;color:var(--ink-soft);font-family:'Cormorant Garamond',serif;font-size:1.1rem;}

  .confetti-container{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999;}
  .confetti-piece{position:absolute;top:-12px;opacity:0.9;animation:confetti-fall linear forwards;}
  @keyframes confetti-fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(110vh) rotate(600deg);opacity:0.7;}
  }
  @media (prefers-reduced-motion: reduce){
    .spinner, .spinner-sm{animation:none;border-top-color:var(--gold-pale);}
    .confetti-piece{display:none;}
  }
  .attendee-row{display:grid;grid-template-columns:1fr 108px;gap:8px;margin-bottom:10px;}
  .attendee-row.name-only{grid-template-columns:1fr;}
  .form-error{color:var(--maroon);font-size:0.88rem;margin:10px 0;min-height:1em;}
  .event-block{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin-bottom:18px;}
  .event-block.wedding{border-left-color:var(--maroon);}
  .event-block.reception{border-left-color:var(--reception-accent);}
  .event-meta{font-size:0.85rem;color:var(--ink-soft);margin:2px 0 12px;}
  footer{
    text-align:center;
    margin-top:28px;
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
  }
  .stat{
    background:var(--paper);

<script>

const DEFAULT_SETTINGS = {
  coupleNames: "Nandakishore & Sai Priya",
  groomName: "Nandakishore",
  brideName: "Sai Priya",
  landingMessage: "We'd love to have you with us — please take a moment to RSVP below so we can plan for you.",
  weddingDate: "2026-12-14",
  weddingTime: "Muhurtham 11:45 am – 12:30 pm · Lunch to follow",
  weddingDistrict: "Thrissur",
  weddingVenue: "Chakolas Pavilion Convention Centre, Kuttanellur, Thrissur",
  receptionDate: "2026-12-15",
  receptionTime: "6:30 pm – 9:30 pm",
  receptionDistrict: "Ernakulam",
  receptionVenue: "Hanger Auditorium, Recca Club, Kakkanad, Kochi",
  deadline: "",
  siteUrl: "",
  notifyEmail: "",
  passcode: "kasavu2026"
};

let state = {
  settings: null,
  guestList: [],
  responses: {},
  view: 'loading',
  searchTerm: '',
  selectedGuestId: null,
  pendingVerifyId: null,
  verifyError: '',
  manualEntry: false,
  adminAuthed: false,
  adminTab: 'guests',
  bulkText: '',
  editingGuestId: null,
  mergeSourceId: null,
  mergeSearchTerm: '',
  verifiedPhone: '',
  adminPasscode: '',
  dataLoading: false,
  fullGuests: {},     // full guest records unlocked by phone verification, by id
  remembered: null,   // {id, name, phone} of the guest who RSVP'd on this device
  restoringMe: false,
  welcomeBack: false
};

// ---------- API (Google Sheets via Apps Script) ----------
// After deploying the Apps Script (see setup instructions), paste the Web App URL below.
const API_URL = "https://script.google.com/macros/s/AKfycby8cdcN4zG6MPqBY2vn6ENyaBPYxpwlVDKrrmjz35kYry1EtVdBbwJqz2-h8b2JsIar3Q/exec";

function apiConfigured(){
  return API_URL && !API_URL.startsWith("PASTE_YOUR_");
}

// SheetJS is ~900KB and is only ever needed by two admin-only features
// (Excel upload and template download). Loading it on demand keeps it off
// the critical path for guests, who make up almost all page loads.
let xlsxLoader = null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoader) return xlsxLoader;
  xlsxLoader = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => { xlsxLoader = null; reject(new Error('Could not load the spreadsheet library')); };
    document.head.appendChild(s);
  });
  return xlsxLoader;
}

async function apiGet(){
  const res = await fetch(API_URL, { method: 'GET' });
  if(!res.ok) throw new Error('API GET failed: HTTP ' + res.status);
  return await res.json();
}
async function apiPost(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('API POST failed: HTTP ' + res.status);
  const data = await res.json();
  if(data && data.ok === false) throw new Error(data.error || 'API reported failure');
  return data;
}
async function withRetry(fn, retries=2, delayMs=700){
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{ return await fn(); }
    catch(err){
      lastErr = err;
      console.warn('API attempt failed (' + (i+1) + '/' + (retries+1) + '):', err);
      if(i < retries) await new Promise(r => setTimeout(r, delayMs));
    }
  }
  throw lastErr;
}

// Google Sheets returns date cells as full ISO timestamps
// ("2026-12-13T18:30:00.000Z"), but <input type="date"> only accepts
// YYYY-MM-DD and silently renders blank for anything else — which then got
// saved back as an empty date, breaking the countdown, the calendar links
// and the .ics export. Normalise on load so every consumer sees a clean
// date string regardless of how the sheet stored it.
function normaliseDateSettings(settings){
  ['weddingDate','receptionDate','deadline'].forEach(k => {
    const v = settings[k];
    if(!v) return;
    const s = String(v);
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return; // already clean
    // Take the calendar date in IST, since that's the timezone the events
    // are actually in — using UTC here can shift the date back by one day.
    const d = new Date(s);
    if(isNaN(d)) return;
    const ist = new Date(d.getTime() + (5.5 * 60 * 60 * 1000));
    settings[k] = ist.toISOString().slice(0,10);
  });
  return settings;
}

// Pulls the full guest list and every response. Only works once the admin
// passcode has been verified — this is the data deliberately withheld from
// the public payload every guest's browser receives.
async function loadAdminData(){
  try{
    const data = await withRetry(() => apiPost({ action: 'adminData', passcode: state.adminPasscode }));
    state.guestList = data.guestList || [];
    state.responses = data.responses || {};
    state.apiLoadFailed = false;
  }catch(e){
    console.error('Failed to load admin data:', e);
    state.apiLoadFailed = true;
  }
}

async function loadAll(){
  if(!apiConfigured()){
    state.settings = {...DEFAULT_SETTINGS};
    state.guestList = [];
    state.responses = {};
    state.apiNotConfigured = true;
    return;
  }
  try{
    const data = await withRetry(() => apiGet());
    state.settings = normaliseDateSettings(Object.assign({}, DEFAULT_SETTINGS, data.settings || {}));
    // Public payload only — names and last-4 digits for search. Full guest
    // details arrive per-guest after phone verification, or wholesale for
    // an authenticated admin (loadAdminData).
    // Keep any full records this visitor has already unlocked (their own,
    // after phone verification) rather than downgrading them to the
    // trimmed public version.
    state.guestList = (data.guestList || []).map(g => state.fullGuests[g.id] || g);
    Object.keys(state.fullGuests).forEach(id => {
      if(!state.guestList.some(g => g.id === id)) state.guestList.push(state.fullGuests[id]);
    });
    state.responses = Object.assign({}, data.responses || {}, state.responses);
    state.apiLoadFailed = false;
    savePublicCache(data);
  }catch(e){
    console.error('Failed to load data from the sheet:', e);
    if(!state.settings) state.settings = {...DEFAULT_SETTINGS}; // first-ever load: nothing to preserve
    state.apiLoadFailed = true;
  }
}

// Last copy of the public guest list (names, last-4 digits, invite flags —
// the same data every visitor's browser already receives), kept on this
// device so a returning guest can search instantly while a fresh copy loads
// in the background. Anything sensitive is still fetched live after phone
// verification. Storage can be unavailable (private mode), so every access
// is guarded and the page works the same without it.
const PUBLIC_CACHE_KEY = 'rsvpPublicCache_v1';
const PUBLIC_CACHE_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;
function savePublicCache(data){
  try{
    localStorage.setItem(PUBLIC_CACHE_KEY, JSON.stringify({ t: Date.now(), settings: data.settings || {}, guestList: data.guestList || [] }));
  }catch(e){}
}
function readPublicCache(){
  try{
    const c = JSON.parse(localStorage.getItem(PUBLIC_CACHE_KEY) || 'null');
    if(!c || !Array.isArray(c.guestList) || Date.now() - c.t > PUBLIC_CACHE_MAX_AGE_MS) return null;
    return c;
  }catch(e){ return null; }
}

function newId(){
  return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
}
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '';
  const datePart = String(iso).split('T')[0];
  const d = new Date(datePart + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});
}
function clampCount(n){ return Math.min(5, Math.max(1, parseInt(n,10) || 1)); }
function countOptions(selected){
  const sel = clampCount(selected);
  let opts = '';
  for(let i=1;i<=5;i++){
    opts += `<option value="${i}" ${sel===i?'selected':''}>${i} ${i===1?'person':'people'}</option>`;
  }
  return opts;
}
function dietaryOptions(selected){
  const opts = [['', 'Select'], ['Veg','Veg'], ['Non-veg','Non-veg']];
  return opts.map(([val,label]) =>
    `<option value="${val}" ${selected===val?'selected':''}>${label}</option>`
  ).join('');
}

// "Who invited you?" — two tappable portrait cards. Each card is a <label>
// wrapping a real (visually hidden) radio input, so keyboard, screen-reader
// and form behaviour are unchanged and existing code that reads
// input[name="inviteSide"]:checked keeps working.
function sideSelectorHtml(selected){
  const s = state.settings;
  const card = (value, id, sideLabel, personName, photo) => `
      <label class="side-card" for="${id}">
        <input type="radio" class="side-input" name="inviteSide" id="${id}" value="${value}" ${selected===value?'checked':''}>
        <img src="${photo}" alt="" width="74" height="74">
        <small>${sideLabel}</small>
        ${personName ? `<b>${escapeHtml(personName)}</b>` : ''}
      </label>`;
  return `<div id="sideGroup" role="radiogroup" aria-labelledby="sideGroupLabel">
    <label id="sideGroupLabel">Who invited you?</label>
    <div class="side-pair">
      ${card('groom', 'sideGroom', "Groom's side", s.groomName, SIDE_PORTRAITS.groom)}
      ${card('bride', 'sideBride', "Bride's side", s.brideName, SIDE_PORTRAITS.bride)}
    </div>
  </div>`;
}
// The wedding lunch is pure vegetarian, so those rows collect names only —
// no meal dropdown. The reception still asks Veg/Non-veg. For the manual-
// entry form (prefix 'm') there's a single event radio, so which applies
// depends on what's currently selected.
function eventNeedsDiet(prefix){
  if(prefix === 'wed') return false;
  if(prefix === 'm'){
    // On the form's first render the radios aren't in the DOM yet; Wedding
    // is the pre-selected option, so default to its no-meal rows.
    const radio = document.querySelector('input[name="manualEvent"]:checked');
    return !!radio && radio.value !== 'wedding';
  }
  return true;
}
function attendeeRowsHtml(prefix, count, existingAttendees){
  const withDiet = eventNeedsDiet(prefix);
  let rows = '';
  for(let i=0;i<count;i++){
    const a = (existingAttendees && existingAttendees[i]) || {};
    rows += `
      <div class="attendee-row${withDiet ? '' : ' name-only'}">
        <input type="text" class="${prefix}-att-name" placeholder="Guest ${i+1} name" value="${escapeHtml(a.name||'')}">
        ${withDiet ? `<select class="${prefix}-att-diet">${dietaryOptions(a.dietary||'')}</select>` : ''}
      </div>`;
  }
  return rows;
}
function regenerateAttendeeRows(prefix){
  const countSel = document.getElementById(prefix+'Count');
  if(!countSel) return;
  const count = clampCount(countSel.value);
  const container = document.getElementById(prefix+'Attendees');
  if(!container) return;
  const nameInputs = container.querySelectorAll('.'+prefix+'-att-name');
  const dietSelects = container.querySelectorAll('.'+prefix+'-att-diet');
  const existing = [];
  nameInputs.forEach((inp,i) => existing.push({name: inp.value, dietary: dietSelects[i] ? dietSelects[i].value : ''}));
  container.innerHTML = attendeeRowsHtml(prefix, count, existing);
  // Rows were rebuilt, so any names carried over from the other event need
  // re-applying — again only into blanks, never over what's been typed.
  syncNamesAcrossEvents(prefix === 'wed' ? 'rec' : 'wed', prefix);
  bindAttendeeNameSync();
}

// Copies guest names between the wedding and reception rows so a household
// invited to both doesn't type the same names twice. Only ever fills BLANK
// fields — anything already typed in the target is left untouched — and
// only as far as the target's headcount allows.
function syncNamesAcrossEvents(fromPrefix, toPrefix){
  const from = document.getElementById(fromPrefix+'Attendees');
  const to = document.getElementById(toPrefix+'Attendees');
  if(!from || !to) return;
  const fromNames = from.querySelectorAll('.'+fromPrefix+'-att-name');
  const toNames = to.querySelectorAll('.'+toPrefix+'-att-name');
  for(let i=0; i<toNames.length && i<fromNames.length; i++){
    if(!toNames[i].value.trim() && fromNames[i].value.trim()){
      toNames[i].value = fromNames[i].value;
    }
  }
}

// Wires up live copying in both directions, so whichever event the guest
// fills in first populates the other.
function bindAttendeeNameSync(){
  [['wed','rec'], ['rec','wed']].forEach(([from, to]) => {
    const container = document.getElementById(from+'Attendees');
    if(!container) return;
    container.querySelectorAll('.'+from+'-att-name').forEach(inp => {
      if(inp.dataset.syncBound === 'true') return;
      inp.dataset.syncBound = 'true';
      inp.addEventListener('blur', () => syncNamesAcrossEvents(from, to));
    });
  });
}
function collectAttendees(prefix){
  const container = document.getElementById(prefix+'Attendees');
  if(!container) return [];
  const nameInputs = container.querySelectorAll('.'+prefix+'-att-name');
  const dietSelects = container.querySelectorAll('.'+prefix+'-att-diet');
  const attendees = [];
  // Wedding rows have no meal dropdown (pure-veg lunch), so record 'Veg'
  // for them rather than leaving the field empty — keeps the catering
  // export and the veg/non-veg dashboard totals accurate.
  nameInputs.forEach((inp,i) => attendees.push({
    name: inp.value.trim(),
    dietary: eventNeedsDiet(prefix) ? (dietSelects[i] ? dietSelects[i].value : '') : 'Veg'
  }));
  return attendees;
}
function validateAttendees(attendees, prefix){
  if(attendees.length === 0) return false;
  if(prefix && !eventNeedsDiet(prefix)) return attendees.every(a => a.name);
  return attendees.every(a => a.name && a.dietary);
}
// Used by admin flows after a bulk import — must fetch the full records,
// not the trimmed public payload.
async function refreshGuestList(){
  await loadAdminData();
}

// ---------- routing ----------
function currentRoute(){
  return location.hash === '#admin' ? 'admin' : 'guest';
}
window.addEventListener('hashchange', () => { render(); });

// ---------- render dispatcher ----------
function apiStatusBanner(){
  if(state.apiNotConfigured){
    return `<div class="card" style="border-color:var(--maroon);margin-bottom:20px;">
      <strong style="color:var(--maroon)">Setup still in progress</strong>
      <p style="margin:6px 0 0">The wedding team hasn't connected this page to its data source yet. Please check back shortly.</p>
    </div>`;
  }
  if(state.apiLoadFailed){
    return `<div class="card" style="border-color:var(--maroon);margin-bottom:20px;">
      <strong style="color:var(--maroon)">Couldn't load the latest data</strong>
      <p style="margin:6px 0 0">Please refresh the page and try again.</p>
    </div>`;
  }
  return '';
}

function render(){
  // Re-rendering replaces the DOM, which would otherwise drop focus — and
  // with it the phone keyboard — if the guest list arrives while someone is
  // typing. Remember the focused field and restore it afterwards.
  const active = document.activeElement;
  const keep = active && active.id && /^(INPUT|TEXTAREA)$/.test(active.tagName)
    ? { id: active.id, start: active.selectionStart, end: active.selectionEnd } : null;
  renderInner();
  if(keep){
    const el = document.getElementById(keep.id);
    if(el && el !== document.activeElement){
      el.focus({ preventScroll: true });
      try{ el.setSelectionRange(keep.start, keep.end); }catch(e){}
    }
  }
}
function renderInner(){
  const app = document.getElementById('app');
  if(state.countdownInterval){ clearInterval(state.countdownInterval); state.countdownInterval = null; }
  if(state.view === 'loading'){ app.innerHTML = '<div class="loading-screen"><div class="spinner"></div><p>Loading…</p></div>'; return; }

  if(currentRoute() === 'admin'){
    document.querySelector('.wrap').classList.add('wide');
    if(!state.adminAuthed){ renderAdminLogin(app); }
    else{ renderAdmin(app); }
    return;
  }
  document.querySelector('.wrap').classList.remove('wide');
  renderGuestFlow(app);
}

// ================= GUEST FLOW =================
function runCountdown(targetIso){
  const el = document.getElementById('countdown');
  if(!el || !targetIso) return;
  const datePart = String(targetIso).split('T')[0];
  const target = new Date(datePart + 'T00:00:00');
  function tick(){
    let diff = target - new Date();
    if(diff < 0) diff = 0;
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    el.innerHTML = `
      <div class="unit"><span class="val">${days}</span><span class="lbl">days</span></div>
      <div class="unit"><span class="val">${hours}</span><span class="lbl">hours</span></div>
      <div class="unit"><span class="val">${mins}</span><span class="lbl">mins</span></div>`;
  }
  tick();
  state.countdownInterval = setInterval(tick, 60000);
}

// Keeps each name whole so a narrow phone breaks the title after "&"
// ("Nandakishore & / Sai Priya") rather than inside a name ("Sai / Priya").
function coupleNamesHtml(names){
  return String(names || '').split(/\s*&\s*/)
    .map(n => `<span class="nowrap">${escapeHtml(n)}</span>`)
    .join(' &amp; ');
}

function shortDate(iso){
  if(!iso) return '';
  const d = new Date(String(iso).split('T')[0] + 'T00:00:00');
  if(isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
}

// Venue city for short summaries: the part after the last comma of the
// venue ("…, Kakkanad, Kochi" → "Kochi"), falling back to the district.
function eventCity(venue, district){
  const parts = String(venue || '').split(',').map(p => p.trim()).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : (district || '');
}

function landingEventsHtml(){
  const s = state.settings;
  const rows = [];
  if(s.weddingDate) rows.push(`<li><span class="ev">Wedding</span><span>${escapeHtml(shortDate(s.weddingDate))} · ${escapeHtml(eventCity(s.weddingVenue, s.weddingDistrict))}</span></li>`);
  if(s.receptionDate) rows.push(`<li><span class="ev">Reception</span><span>${escapeHtml(shortDate(s.receptionDate))} · ${escapeHtml(eventCity(s.receptionVenue, s.receptionDistrict))}</span></li>`);
  return rows.length ? `<ul class="landing-events">${rows.join('')}</ul>` : '';
}

// Couple photo on the welcome screen. Served straight from the GitHub repo
// (couple.jpg next to index.html) rather than through Drive/Apps Script, so
// it loads as fast as the page itself. If the file isn't there yet the
// frame simply doesn't appear.
const COUPLE_PHOTO = 'couple.jpg';
function couplePhotoHtml(){

    <img src="${COUPLE_PHOTO}" alt="${escapeHtml(state.settings.coupleNames)}" width="600" height="750"
      decoding="async" fetchpriority="high"

function renderGuestFlow(app){
  const s = state.settings;
  const onLanding = !state.submittedFor && !state.selectedGuestId && !state.manualEntry && !state.pendingVerifyId;
  let html = onLanding && !state.apiNotConfigured
    ? `${couplePhotoHtml()}<h1 class="landing-title">${coupleNamesHtml(s.coupleNames)}</h1>${apiStatusBanner()}`
    : `<h1>${coupleNamesHtml(s.coupleNames)}</h1>${apiStatusBanner()}`;

  if(onLanding && !state.apiNotConfigured){
    html += `<p class="tagline">${escapeHtml(s.landingMessage || DEFAULT_SETTINGS.landingMessage)}</p>`;
    if(state.restoringMe){
      html += `<div class="restore-note"><span class="spinner spinner-sm"></span>Welcome back${state.remembered && state.remembered.name ? ', ' + escapeHtml(state.remembered.name) : ''} — opening your RSVP…</div>`;
    }
    html += landingEventsHtml();
  }

  if(state.submittedFor){
    html += renderConfirmation();
    app.innerHTML = html;
    bindConfirmationEvents();
    runCountdown(state.submittedFor.countdownTarget);
    if(state.submittedFor.weddingAttending) upgradeInviteImage('wedding', state.submittedFor.side, 'inviteImgWedding');
    if(state.submittedFor.receptionAttending) upgradeInviteImage('reception', state.submittedFor.side, 'inviteImgReception');
    return;
  }

  if(state.pendingVerifyId){
    html += renderPhoneVerify();
    app.innerHTML = html;
    bindPhoneVerifyEvents();
    return;
  }

  if(state.selectedGuestId || state.manualEntry){
    html += renderRsvpForm();
    app.innerHTML = html;
    bindRsvpFormEvents();
    return;
  }

  if(state.apiNotConfigured){
    app.innerHTML = html;
    return;
  }

  html += `
    <div class="field">
      <label for="searchInput">Find your name to RSVP</label>
      <input type="text" id="searchInput" placeholder="Type your name or phone number" value="${escapeHtml(state.searchTerm)}" autocomplete="off">
    </div>
    <div id="searchResults"></div>
    <div class="manual-cta">
      <span>Not on the list?</span>
      <button type="button" class="pill-btn" id="manualBtn">Can't find your name? RSVP here</button>
    </div>
    <footer><a href="#admin" class="muted-link">Wedding team</a></footer>
  `;
  app.innerHTML = html;

  const input = document.getElementById('searchInput');
  input.addEventListener('input', (e) => {
    state.searchTerm = e.target.value;
    renderSearchResults();
  });
  // Autofocus only where there's a physical keyboard — on phones it pops
  // the on-screen keyboard over the welcome message and dates.
  if(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) input.focus();
  renderSearchResults();
  document.getElementById('manualBtn').addEventListener('click', () => {
    state.manualEntry = true;
    render();
  });
}

function renderSearchResults(){
  const box = document.getElementById('searchResults');
  if(!box) return;
  const term = state.searchTerm.trim().toLowerCase();
  if(term.length < 2){ box.innerHTML=''; return; }
  // The guest list may still be in flight — say so rather than claiming
  // there's no match, which would send people to manual entry needlessly.
  if(state.dataLoading){
    box.innerHTML = `<p class="search-empty"><span class="spinner spinner-sm"></span>Loading the guest list…</p>`;
    return;
  }
  const digits = term.replace(/\D/g,'');
  const matches = state.guestList.filter(g => {
    const nameMatch = g.name.toLowerCase().includes(term);
    // Only the last four digits are sent to the browser, so phone search
    // matches against those (a guest typing their full number still works,
    // since its last four will match).
    const last4 = g.phoneLast4 || '';
    const phoneMatch = digits.length >= 3 && last4 && (last4.includes(digits) || digits.slice(-4) === last4);
    return nameMatch || phoneMatch;
  }).slice(0, 8);

  if(matches.length === 0){
    box.innerHTML = `<p class="search-empty">No match yet — keep typing, or use "Can't find your name?" below.</p>`;
    return;
  }
  box.innerHTML = matches.map(g => {
    const responded = g.responded || !!state.responses[g.id];
    const phoneTail = g.phoneLast4 || '';
    return `<div class="card clickable" data-id="${g.id}" role="button" tabindex="0">
      <strong>${escapeHtml(g.name)}</strong>
      ${phoneTail ? `<div class="helptext" style="margin:2px 0 0">•••• ${phoneTail}</div>` : ''}
      ${responded ? '<span class="badge yes" style="margin-top:8px;display:inline-block">Already responded — tap to update</span>' : ''}
    </div>`;
  }).join('');
  box.querySelectorAll('.card').forEach(el => {
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } });
    el.addEventListener('click', () => {
      const guest = state.guestList.find(g => g.id === el.dataset.id);
      if(guest && guest.hasPhone){
        state.pendingVerifyId = el.dataset.id;
        state.verifyError = '';
      } else {
        // No usable phone on file for this record — nothing to verify against,
        // so let them through as before rather than blocking a legitimate guest.
        state.selectedGuestId = el.dataset.id;
      }
      render();
    });
  });
}

function renderPhoneVerify(){
  const guest = state.guestList.find(g => g.id === state.pendingVerifyId);
  if(!guest){ state.pendingVerifyId = null; return ''; }
  return `
    <div class="tag">Confirming it's you</div>
    <div class="card">
      <p>To protect ${escapeHtml(guest.name)}'s RSVP from being changed by someone else, please enter the 10-digit phone number we have on file for this household.</p>
      <div class="field">
        <label for="verifyPhone">Phone number</label>
        <input type="tel" id="verifyPhone" placeholder="10-digit phone number" autocomplete="off" inputmode="numeric" maxlength="10">
      </div>
      ${state.verifyError ? `<div class="form-error" role="alert">${escapeHtml(state.verifyError)}</div>` : ''}
      <button class="btn" id="verifyBtn">Confirm</button>
    </div>
    <button class="muted-link" id="verifyBackBtn">Back to search</button>
  `;
}

function bindPhoneVerifyEvents(){
  const input = document.getElementById('verifyPhone');
  if(!input) return; // guest record not found — nothing to bind
  input.focus();
  input.addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('verifyBtn').click(); });
  document.getElementById('verifyBtn').addEventListener('click', async () => {
    const guest = state.guestList.find(g => g.id === state.pendingVerifyId);
    if(!guest){ state.pendingVerifyId = null; render(); return; }
    const entered = (document.getElementById('verifyPhone').value || '').replace(/\D/g,'');
    if(entered.length !== 10){
      state.verifyError = "Please enter the full 10-digit number.";
      render();
      return;
    }
    const btn = document.getElementById('verifyBtn');
    btn.innerHTML = '<span class="spinner spinner-sm"></span>Checking…';
    btn.disabled = true;
    try{
      // The browser no longer holds anyone's full phone number, so the
      // match is made server-side. A success also returns this guest's own
      // record and existing response — the only guest data this browser
      // ever receives in full.
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'verifyGuest', id: state.pendingVerifyId, phone: entered })
      });
      const data = await res.json();
      if(data && data.ok && data.guest){
        state.verifyError = '';
        if(data.response){
          // Already responded: show their RSVP with an Edit button rather
          // than dropping them straight back into the form.
          showSummaryFor(data.guest, data.response, entered);
          render();
          return;
        }
        // Replace the minimal search record with the full one.
        state.fullGuests[data.guest.id] = data.guest;
        state.guestList = state.guestList.map(g => g.id === data.guest.id ? data.guest : g);
        state.selectedGuestId = state.pendingVerifyId;
        state.verifiedPhone = entered;
        state.pendingVerifyId = null;
        render();
      } else {
        state.verifyError = "That doesn't match the number we have on file — please check and try again.";
        render();
      }
    }catch(err){
      console.error('Phone verification failed:', err);
      state.verifyError = "Couldn't check that just now — please check your connection and try again.";
      render();
    }
  });
  document.getElementById('verifyBackBtn').addEventListener('click', () => {
    state.pendingVerifyId = null;
    state.verifyError = '';
    render();
  });
}

function declineCardHtml(checked){

    <label class="decline-card${checked ? ' on' : ''}" for="declineAll" id="declineCard">

function renderRsvpForm(){
  let header = '', events = '', declined = false, nEvents = 0;

  if(state.manualEntry){
    header = `
      <div class="tag">New RSVP</div>
      <div class="card">
        <div class="field"><label for="mName">Your name / household</label><input type="text" id="mName" placeholder="e.g. Ramesh &amp; family" autocomplete="name"></div>
        <div class="field"><label for="mPhone">Phone number</label><input type="tel" id="mPhone" placeholder="10-digit phone number" inputmode="numeric" maxlength="10" autocomplete="tel-national"></div>
        <div class="field"><label for="mPhoneConfirm">Confirm phone number</label><input type="tel" id="mPhoneConfirm" placeholder="Re-enter the same number" inputmode="numeric" maxlength="10" autocomplete="off"></div>
        <p class="helptext" style="margin-top:-6px">We'll use this to make sure only you can come back and edit this RSVP later, so please double check it's correct.</p>
        ${sideSelectorHtml('')}
      </div>`;
    events = eventCardHtml('wedding', { checked: false, count: 1 }) + eventCardHtml('reception', { checked: false, count: 1 });

      <div class="tag">${existing ? 'Updating the RSVP for' : 'Confirming for'} ${escapeHtml(guest.name)}</div>
      <div class="card">${sideSelectorHtml(existing?.side)}</div>`;
    nEvents = (showWed ? 1 : 0) + (showRec ? 1 : 0);
    if(showWed) events += eventCardHtml('wedding', {
      checked: !!existing && existing.weddingAttending,
      count: existing && existing.weddingAttending ? existing.weddingCount : guest.weddingDefaultCount,
      attendees: existing?.weddingAttendees
    });
    if(showRec) events += eventCardHtml('reception', {
      checked: !!existing && existing.receptionAttending,
      count: existing && existing.receptionAttending ? existing.receptionCount : guest.receptionDefaultCount,

    ${header}

function setEventOpen(prefix, open){
  const card = document.getElementById(prefix+'Card');
  const chk = document.getElementById(prefix+'Attend');
  const details = document.getElementById(prefix+'Details');
  if(!card || !details) return;
  card.classList.toggle('open', open);
  details.hidden = !open;
  if(chk) chk.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function bindRsvpFormEvents(){
  bindAttendeeNameSync();
  document.querySelectorAll('input[name="inviteSide"]').forEach(radio => {
    radio.addEventListener('change', prefetchInvites);
  });
  prefetchInvites();

  const wedChk = document.getElementById('wedAttend');
  const recChk = document.getElementById('recAttend');
  const decline = document.getElementById('declineAll');
  const choices = document.getElementById('eventChoices');

  const applyDecline = () => {
    const on = decline.checked;
    document.getElementById('declineCard').classList.toggle('on', on);
    choices.classList.toggle('declined', on);
    [['wed', wedChk], ['rec', recChk]].forEach(([prefix, chk]) => {
      if(!chk) return;
      if(on){ chk.checked = false; setEventOpen(prefix, false); }
      chk.disabled = on;
    });
  };
  applyDecline();
  decline.addEventListener('change', () => { clearFieldErrors(); showFormError(''); applyDecline(); });

  if(wedChk) wedChk.addEventListener('change', () => {
    setEventOpen('wed', wedChk.checked);
    if(wedChk.checked){ syncNamesAcrossEvents('rec', 'wed'); prefetchInvites(); }
  });
  if(recChk) recChk.addEventListener('change', () => {
    setEventOpen('rec', recChk.checked);
    if(recChk.checked){ syncNamesAcrossEvents('wed', 'rec'); prefetchInvites(); }
  });
  const wedCount = document.getElementById('wedCount');
  if(wedCount) wedCount.addEventListener('change', () => regenerateAttendeeRows('wed'));
  const recCount = document.getElementById('recCount');
  if(recCount) recCount.addEventListener('change', () => regenerateAttendeeRows('rec'));

  document.getElementById('backBtn').addEventListener('click', () => {
    // Backing out of an edit returns to the RSVP summary, not the search page.
    const id = state.selectedGuestId;
    if(id && state.responses[id] && state.remembered && state.remembered.id === id){
      state.submittedFor = submittedFromResponse(state.guestList.find(g => g.id === id), state.responses[id]);
      state.welcomeBack = true;
    }
    state.selectedGuestId = null;
    state.manualEntry = false;
    render();
  });
  document.getElementById('submitRsvp').addEventListener('click', async () => {
    await submitRsvp();
  });
}

// Shows the error in two places: next to the field that needs fixing (so
// the guest sees exactly what to correct, and the page scrolls there), and
// in the summary line above the Send button. anchorId is the element the
// inline message goes after; omit it for errors not tied to one field.
function clearFieldErrors(){
  document.querySelectorAll('.field-error').forEach(el => el.remove());
  document.querySelectorAll('.has-error').forEach(el => el.classList.remove('has-error'));
}
function showFormError(msg, anchorId){
  const el = document.getElementById('formError');
  if(el) el.textContent = msg;
  else console.error(msg);
  if(!msg || !anchorId) return;
  const anchor = document.getElementById(anchorId);
  if(!anchor) return;
  const target = anchor.closest('.field') || anchor;
  target.classList.add('has-error');
  const note = document.createElement('div');
  note.className = 'field-error';
  note.textContent = msg;
  target.insertAdjacentElement('afterend', note);
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const focusable = anchor.matches('input,select') ? anchor : anchor.querySelector('input,select');
  if(focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 250);
}

async function submitRsvp(){
  showFormError('');
  clearFieldErrors();

  let id, name, phoneDigitsForNewGuest = '';
  if(state.manualEntry){
    name = document.getElementById('mName').value.trim();
    if(!name){ showFormError('Please enter your name.', 'mName'); return; }
    const phoneDigits = document.getElementById('mPhone').value.replace(/\D/g,'');
    const phoneConfirmDigits = document.getElementById('mPhoneConfirm').value.replace(/\D/g,'');
    if(phoneDigits.length !== 10){ showFormError('Please enter a valid 10-digit phone number.', 'mPhone'); return; }
    if(phoneDigits !== phoneConfirmDigits){ showFormError("The two phone numbers don't match — please check and re-enter.", 'mPhoneConfirm'); return; }
    phoneDigitsForNewGuest = phoneDigits;
  }

  const sideRadio = document.querySelector('input[name="inviteSide"]:checked');
  if(!sideRadio){ showFormError("Please choose whether you're invited from the groom's or bride's side.", 'sideGroup'); return; }
  const side = sideRadio.value;

  const declined = document.getElementById('declineAll').checked;
  const wedChk = document.getElementById('wedAttend');
  const recChk = document.getElementById('recAttend');
  const weddingAttending = !declined && !!(wedChk && wedChk.checked);
  const receptionAttending = !declined && !!(recChk && recChk.checked);
  if(!declined && !weddingAttending && !receptionAttending){
    showFormError("Please tick the celebration you'll attend, or “Sorry, I won't be able to make it”.", 'eventChoices');
    return;
  }

  let weddingCount = 0, receptionCount = 0, weddingAttendees = [], receptionAttendees = [];
  if(weddingAttending){
    weddingCount = clampCount(document.getElementById('wedCount').value);
    weddingAttendees = collectAttendees('wed');
    if(!validateAttendees(weddingAttendees, 'wed')){ showFormError('Please enter a name for every Wedding guest.', 'wedAttendees'); return; }
  }
  if(receptionAttending){
    receptionCount = clampCount(document.getElementById('recCount').value);
    receptionAttendees = collectAttendees('rec');
    if(!validateAttendees(receptionAttendees, 'rec')){ showFormError('Please enter a name and Veg/Non-veg for every Reception guest.', 'recAttendees'); return; }
  }

  let newGuestRecord = null;
  if(state.manualEntry){
    id = newId();
    newGuestRecord = {
      id, name,
      phone: phoneDigitsForNewGuest,
      weddingInvited: weddingAttending, receptionInvited: receptionAttending,
      weddingDefaultCount: weddingCount, receptionDefaultCount: receptionCount,
      unmatched: true
    };
    state.guestList.push(newGuestRecord);
    state.fullGuests[id] = newGuestRecord;
  } else {
    id = state.selectedGuestId;
    name = state.guestList.find(g => g.id === id).name;
  }

  const responseRecord = {
    id, side, weddingAttending, weddingCount, weddingAttendees,
    receptionAttending, receptionCount, receptionAttendees,
    respondedAt: new Date().toISOString()
  };
  // Phone proof for the backend's server-side check: manual entry has just
  // set the number; a matched guest proved it on the verify screen (or it
  // was remembered on this device from an earlier visit).
  const phoneProof = state.manualEntry ? phoneDigitsForNewGuest : state.verifiedPhone;

  const btn = document.getElementById('submitRsvp');
  const btnLabel = btn.textContent;
  btn.innerHTML = '<span class="spinner spinner-sm"></span>Saving…'; btn.disabled = true;
  try{
    if(newGuestRecord) await withRetry(() => apiPost({ action: 'upsertGuest', guest: newGuestRecord }));
    await withRetry(() => apiPost({ action: 'upsertResponse', response: responseRecord, phone: phoneProof }));
  }catch(err){
    console.error('RSVP save failed:', err);
    btn.textContent = btnLabel; btn.disabled = false;
    if(newGuestRecord) state.guestList = state.guestList.filter(g => g.id !== id); // roll back local add
    showFormError('Could not save your RSVP — please check your connection and try again.');
    return;
  }

  state.responses[id] = responseRecord;
  const guest = state.guestList.find(g => g.id === id);
  if(guest) guest.responded = true;
  rememberMe(id, name, phoneProof);
  state.submittedFor = submittedFromResponse({ id, name }, responseRecord);
  state.welcomeBack = false;
  state.verifiedPhone = phoneProof;
  state.selectedGuestId = null;
  state.manualEntry = false;
  if(weddingAttending || receptionAttending) triggerConfetti();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Shape used by the confirmation / summary screen.
function submittedFromResponse(guest, r){
  return {
    id: guest.id, name: guest.name, side: r.side,
    weddingAttending: !!r.weddingAttending, weddingCount: r.weddingCount || 0, weddingAttendees: r.weddingAttendees || [],
    receptionAttending: !!r.receptionAttending, receptionCount: r.receptionCount || 0, receptionAttendees: r.receptionAttendees || [],
    countdownTarget: r.weddingAttending ? state.settings.weddingDate : (r.receptionAttending ? state.settings.receptionDate : null)
  };
}

// ---------- remembering a guest on their own device ----------
// After someone RSVPs, their id and phone number are kept in this browser
// only (never shared), so their next visit opens straight to their RSVP
// summary. The phone is re-checked with the server each time, exactly as if
// they had typed it, so nothing is trusted from storage alone.
const ME_KEY = 'rsvpMe_v1';
function rememberMe(id, name, phone){
  state.remembered = { id, name, phone };
  try{ localStorage.setItem(ME_KEY, JSON.stringify(state.remembered)); }catch(e){}
}
function forgetMe(){
  state.remembered = null;
  try{ localStorage.removeItem(ME_KEY); }catch(e){}
}
function readMe(){
  try{
    const m = JSON.parse(localStorage.getItem(ME_KEY) || 'null');
    return (m && m.id && /^\d{10}$/.test(String(m.phone || ''))) ? m : null;
  }catch(e){ return null; }
}

// Fetches this guest's own record and response using the remembered phone.
// Returns true when the summary screen has been set up.
async function restoreRememberedGuest(me){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'verifyGuest', id: me.id, phone: me.phone })
    });
    const data = await res.json();
    if(!(data && data.ok && data.guest && data.response)){
      // Number changed, record removed, or no RSVP on file: start fresh.
      forgetMe();
      return false;
    }
    showSummaryFor(data.guest, data.response, me.phone);
    return true;
  }catch(err){
    console.warn('Could not restore saved RSVP:', err);
    return false; // network hiccup — keep the saved identity and show the normal page
  }
}

function showSummaryFor(guest, response, phone){
  state.fullGuests[guest.id] = guest;
  if(state.guestList.some(g => g.id === guest.id)) state.guestList = state.guestList.map(g => g.id === guest.id ? guest : g);
  else state.guestList.push(guest);
  state.responses[guest.id] = response;
  state.verifiedPhone = phone;
  rememberMe(guest.id, guest.name, phone);
  state.submittedFor = submittedFromResponse(guest, response);
  state.welcomeBack = true;
  state.pendingVerifyId = null;
  state.selectedGuestId = null;
  state.manualEntry = false;
}

function hasCustomInvite(event, side){
  const key = event + 'Invite' + (side === 'groom' ? 'Groom' : 'Bride') + 'FileId';
  return !!state.settings[key];
}

function inviteImageMarkup(event, side, elId){
  // Invite artwork is fetched from Drive via the Apps Script proxy rather
  // than embedded in this file — keeping ~300KB of base64 off every guest's
  // initial page load. Render a placeholder now; upgradeInviteImage()
  // swaps in the real artwork once it arrives.
  if(hasCustomInvite(event, side)){
    return `<div class="invite-loading" id="${elId}">Loading your invite…</div>`;
  }
  return '';
}

// Fires after the confirmation screen renders, only when an invite image is
// configured for this event+side. Fetches it (base64 JSON — Apps Script
// can't return a raw Blob from doGet) and replaces the loading placeholder
// with the real <img>. If it can't be fetched, the placeholder is removed
// rather than left spinning forever — the RSVP itself has already saved, so
// a missing decorative image shouldn't look like a failure.
// Invite images come through the Apps Script proxy as base64 JSON, which is
// slow for large files. Cache each fetch (by event+side) so re-renders are
// instant, and let the RSVP form kick these off early — by the time the
// guest finishes typing names and submits, the image is usually ready.
const inviteCache = {};
function fetchInviteImage(event, side){
  const sideKey = side === 'groom' ? 'Groom' : 'Bride';
  const imgParam = event + 'Invite' + sideKey;
  if(!state.settings[imgParam + 'FileId']) return Promise.resolve(null);
  if(inviteCache[imgParam]) return inviteCache[imgParam];
  inviteCache[imgParam] = fetch(API_URL + '?img=' + imgParam)
    .then(res => res.json())
    .then(data => (data && data.image) ? ('data:' + (data.mimeType || 'image/jpeg') + ';base64,' + data.image) : null)
    .catch(err => {
      console.error('Invite image fetch failed:', err);
      inviteCache[imgParam] = null; // allow a retry later
      return null;
    });
  return inviteCache[imgParam];
}

// Starts downloading the invites the guest is likely to see, before they
// submit. Safe to call repeatedly — cached fetches are reused.
function prefetchInvites(){
  const side = (document.querySelector('input[name="inviteSide"]:checked') || {}).value;
  if(!side) return;
  const wedChk = document.getElementById('wedAttend');
  const recChk = document.getElementById('recAttend');
  const manualRadio = document.querySelector('input[name="manualEvent"]:checked');
  if((wedChk && wedChk.checked) || (manualRadio && manualRadio.value === 'wedding')) fetchInviteImage('wedding', side);
  if((recChk && recChk.checked) || (manualRadio && manualRadio.value === 'reception')) fetchInviteImage('reception', side);
}

async function upgradeInviteImage(event, side, elId){
  if(!hasCustomInvite(event, side)) return;
  const el = document.getElementById(elId);
  const src = await fetchInviteImage(event, side);
  const target = document.getElementById(elId) || el;
  if(!target) return;
  if(src){
    const label = event === 'wedding' ? 'Wedding' : 'Reception';
    target.outerHTML = `<button type="button" class="invite-zoom" data-zoom="${elId}" data-event="${event}" aria-label="View the ${label.toLowerCase()} invitation full screen">
      <img src="${src}" alt="${label} invitation" id="${elId}">
      <span class="zoom-hint">⤢ Tap to view</span>
    </button>`;
  } else {
    target.remove();
  }
}

// Google Calendar template link. This is the reliable path on Android,
// where downloaded .ics files often fail to hand off to the Calendar app
// (the Google Calendar mobile app has no direct import, so it depends on
// OS file-association that frequently doesn't fire). Uses real start/end
// times when they can be parsed, falling back to an all-day event.
// Event description shared by the .ics and Google Calendar paths. Includes
// the RSVP link when one is configured, so the calendar entry doubles as
// the guest's way back to update their response later — by December it's
// the thing they're most likely to still have.
function calendarDetails(timeStr, venue){
  const parts = [timeStr, venue].filter(Boolean);
  const link = (state.settings.siteUrl || '').trim();
  if(link) parts.push('Need to update your RSVP? ' + link);
  return parts.join(' · ');
}

function gcalUrl(title, dateIso, timeStr, details, location){
  if(!dateIso) return '';
  const datePart = String(dateIso).split('T')[0];
  const times = parseEventTimes(timeStr);
  let dates;
  if(times){
    dates = icsUtcStamp(datePart, times.start.h, times.start.min)
      + '/' + icsUtcStamp(datePart, times.end.h, times.end.min);
  } else {
    const endD = new Date(datePart + 'T00:00:00');
    endD.setDate(endD.getDate() + 1);
    dates = datePart.replace(/-/g,'') + '/' + endD.toISOString().slice(0,10).replace(/-/g,'');
  }
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: dates,
    details: details || '',
    location: location || ''
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

// Pulls start/end clock times out of the free-text time settings (e.g.
// "Muhurtham 11:45 am – 12:30 pm · Lunch to follow" → 11:45 and 12:30).
// Returns null if it can't find a usable time, in which case callers fall
// back to an all-day event rather than inventing a time.
function parseEventTimes(timeStr){
  if(!timeStr) return null;
  const re = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)/gi;
  const found = [];
  let m;
  while((m = re.exec(timeStr)) !== null){
    let h = parseInt(m[1], 10);
    const min = m[2] ? parseInt(m[2], 10) : 0;
    const ampm = m[3].toLowerCase();
    if(ampm === 'pm' && h !== 12) h += 12;
    if(ampm === 'am' && h === 12) h = 0;
    found.push({h, min});
    if(found.length === 2) break;
  }
  if(found.length === 0) return null;
  const start = found[0];
  // No explicit end time given — default to a two-hour block.
  const end = found[1] || {h: (start.h + 2) % 24, min: start.min};
  return {start, end};
}

function pad2(n){ return String(n).padStart(2, '0'); }

// Builds a UTC timestamp string (YYYYMMDDTHHMMSSZ) for a local wall-clock
// time in India (IST, UTC+5:30). Anchoring to a fixed offset rather than the
// guest's own timezone matters — the ceremony is at 11:45 am in Kerala
// regardless of where the guest's phone is set.
function icsUtcStamp(dateIso, h, min){
  const datePart = String(dateIso).split('T')[0];
  const [y, mo, d] = datePart.split('-').map(Number);
  const utcMs = Date.UTC(y, mo - 1, d, h, min, 0) - (5.5 * 60 * 60 * 1000);
  const dt = new Date(utcMs);
  return dt.getUTCFullYear() + pad2(dt.getUTCMonth()+1) + pad2(dt.getUTCDate())
    + 'T' + pad2(dt.getUTCHours()) + pad2(dt.getUTCMinutes()) + '00Z';
}

function icsEscape(s){
  return String(s || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

// Generates a .ics file and triggers a download. Works with Apple Calendar,
// Google Calendar, Outlook and essentially every other calendar app —
// unlike a Google-Calendar-only link, which leaves iPhone users stuck.
function downloadIcs(title, dateIso, timeStr, location, details){
  if(!dateIso) return; // no date — nothing valid to export
  const datePart = String(dateIso).split('T')[0];
  const times = parseEventTimes(timeStr);
  let dtStart, dtEnd;
  if(times){
    dtStart = 'DTSTART:' + icsUtcStamp(datePart, times.start.h, times.start.min);
    dtEnd = 'DTEND:' + icsUtcStamp(datePart, times.end.h, times.end.min);
  } else {
    const compact = datePart.replace(/-/g,'');
    const next = new Date(datePart + 'T00:00:00');
    next.setDate(next.getDate() + 1);
    dtStart = 'DTSTART;VALUE=DATE:' + compact;
    dtEnd = 'DTEND;VALUE=DATE:' + next.toISOString().slice(0,10).replace(/-/g,'');
  }
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Wedding RSVP//EN',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + Date.now() + '-' + Math.random().toString(36).slice(2) + '@wedding-rsvp',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z',
    dtStart,
    dtEnd,
    'SUMMARY:' + icsEscape(title),
    'LOCATION:' + icsEscape(location),
    'DESCRIPTION:' + icsEscape(details),
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  triggerDownload(blob, title.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '.ics');
}

function triggerDownload(blobOrUrl, filename){
  const url = typeof blobOrUrl === 'string' ? blobOrUrl : URL.createObjectURL(blobOrUrl);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if(typeof blobOrUrl !== 'string') setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Saves the invite artwork currently displayed for this event. The <img> is
// already a base64 data URL (fetched via the Apps Script proxy), so this
// needs no extra network round-trip.
function downloadInvite(elId, filename){
  const img = document.getElementById(elId);
  if(!img || !img.src) return;
  triggerDownload(img.src, filename);
}

    });

}

// ---------- full-screen invite viewer ----------
// Opens the tapped invite over the page. It adds a browser history entry,
// so the phone's back button / back swipe closes the viewer and leaves the
// guest on their RSVP, rather than navigating away from the site.
function openInviteViewer(elId, ev){
  const img = document.getElementById(elId);
  if(!img || img.tagName !== 'IMG' || document.querySelector('.lightbox')) return;
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  box.setAttribute('aria-label', img.alt);
  box.innerHTML = `
    <button type="button" class="lb-x" aria-label="Close">×</button>
    <img src="${img.src}" alt="${escapeHtml(img.alt)}">
    <div class="lightbox-bar">
      <button type="button" class="lb-close">Back to my RSVP</button>
      <button type="button" class="lb-save">Save invite</button>
    </div>`;
  document.body.appendChild(box);
  document.body.style.overflow = 'hidden';
  const lastFocus = document.activeElement;
  box.querySelector('.lb-close').focus();

  let closed = false;
  const teardown = () => {
    if(closed) return; closed = true;
    box.remove();
    document.body.style.overflow = '';
    window.removeEventListener('popstate', onPop);
    document.removeEventListener('keydown', onKey);
    if(lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  };
  const onPop = () => teardown();
  const close = () => { if(history.state && history.state.inviteViewer) history.back(); else teardown(); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  try{ history.pushState({ inviteViewer: true }, ''); }catch(e){}
  window.addEventListener('popstate', onPop);
  document.addEventListener('keydown', onKey);

  box.querySelector('.lb-x').addEventListener('click', close);
  box.querySelector('.lb-close').addEventListener('click', close);
  box.addEventListener('click', e => { if(e.target === box) close(); });
  box.querySelector('.lb-save').addEventListener('click', () => {
    const ext = (img.src.match(/^data:image\/(\w+);/) || [,'jpg'])[1].replace('jpeg','jpg');
    downloadInvite(elId, (ev === 'wedding' ? 'wedding-invitation.' : 'reception-invitation.') + ext);
  });
}
document.addEventListener('click', e => {
  const btn = e.target.closest && e.target.closest('[data-zoom]');
  if(btn) openInviteViewer(btn.dataset.zoom, btn.dataset.event);
});

function computeStats(){
  const s = {
    invitedWedding:0, invitedReception:0, invitedBoth:0,
    respondedHouseholds:0, totalHouseholds: state.guestList.length,
    weddingYesCount:0, receptionYesCount:0,
    weddingYesHouseholds:0, receptionYesHouseholds:0,
    unmatched: state.guestList.filter(g=>g.unmatched).length,
    weddingVeg:0, weddingNonveg:0, receptionVeg:0, receptionNonveg:0,
    weddingGroomSide:0, weddingBrideSide:0, receptionGroomSide:0, receptionBrideSide:0
  };
  state.guestList.forEach(g => {
    if(g.weddingInvited) s.invitedWedding++;
    if(g.receptionInvited) s.invitedReception++;
    if(g.weddingInvited && g.receptionInvited) s.invitedBoth++;
  });
  Object.values(state.responses).forEach(r => {
    s.respondedHouseholds++;
    if(r.weddingAttending){
      s.weddingYesCount += r.weddingCount; s.weddingYesHouseholds++;
      if(r.side === 'groom') s.weddingGroomSide += r.weddingCount;
      else if(r.side === 'bride') s.weddingBrideSide += r.weddingCount;
      (r.weddingAttendees||[]).forEach(a => {
        if(a.dietary === 'Veg') s.weddingVeg++;
        else if(a.dietary === 'Non-veg') s.weddingNonveg++;
      });
    }
    if(r.receptionAttending){
      s.receptionYesCount += r.receptionCount; s.receptionYesHouseholds++;
      if(r.side === 'groom') s.receptionGroomSide += r.receptionCount;
      else if(r.side === 'bride') s.receptionBrideSide += r.receptionCount;
      (r.receptionAttendees||[]).forEach(a => {
        if(a.dietary === 'Veg') s.receptionVeg++;
        else if(a.dietary === 'Non-veg') s.receptionNonveg++;
      });
    }
  });
  return s;
}

function exportCsv(){
  const header = ['Household','Phone','Side','Invited Wedding','Invited Reception','Responded',
    'Wedding Attending','Wedding Count','Wedding Guests (Name: Diet)','Wedding Veg','Wedding Non-veg',
    'Reception Attending','Reception Count','Reception Guests (Name: Diet)','Reception Veg','Reception Non-veg'];
  const formatAttendees = list => (list||[]).map(a => `${a.name}: ${a.dietary}`).join('; ');
  const countDiet = (list, kind) => (list||[]).filter(a => a.dietary === kind).length;
  const sideLabel = v => v === 'groom' ? "Groom's side" : v === 'bride' ? "Bride's side" : '';
  const rows = state.guestList.map(g => {
    const r = state.responses[g.id];
    return [
      g.name, g.phone||'', r?sideLabel(r.side):'',
      g.weddingInvited?'Y':'N', g.receptionInvited?'Y':'N',
      r?'Y':'N',
      r?(r.weddingAttending?'Y':'N'):'', r?r.weddingCount:'', r?formatAttendees(r.weddingAttendees):'',
      r?countDiet(r.weddingAttendees,'Veg'):'', r?countDiet(r.weddingAttendees,'Non-veg'):'',
      r?(r.receptionAttending?'Y':'N'):'', r?r.receptionCount:'', r?formatAttendees(r.receptionAttendees):'',
      r?countDiet(r.receptionAttendees,'Veg'):'', r?countDiet(r.receptionAttendees,'Non-veg'):''
    ];
  });
  const csv = [header, ...rows].map(row =>
    row.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')
  ).join('\n');

  const area = document.getElementById('exportArea');
  area.innerHTML = `<p class="helptext">If the download doesn't start automatically, copy the text below.</p>
    <textarea readonly style="min-height:140px;font-family:monospace;font-size:0.8rem;">${escapeHtml(csv)}</textarea>`;
  try{
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'rsvp-export.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ /* fallback textarea already shown */ }
}

// ---------- unmatched-entry resolution: merge into an existing guest ----------

function mergePanelHtml(sourceGuest){
  return `
    <div class="merge-panel">
      <p class="helptext">Merging <strong>${escapeHtml(sourceGuest.name)}</strong>'s response into an existing guest. Search below and pick the correct household — their response, headcount, and dietary details will move over, and this duplicate entry will be removed.</p>
      <div class="field"><input type="text" id="mergeSearchInput" placeholder="Search by name or phone" value="${escapeHtml(state.mergeSearchTerm)}" autocomplete="off"></div>
      <div id="mergeResults"></div>
      <button class="muted-link" id="mergeCancelBtn">Cancel</button>
    </div>
  `;
}

function mergeCandidates(sourceId){
  const term = state.mergeSearchTerm.trim().toLowerCase();
  if(term.length < 1) return [];
  const digits = term.replace(/\D/g,'');
  return state.guestList.filter(g => {
    if(g.id === sourceId || g.unmatched) return false;
    const nameMatch = g.name.toLowerCase().includes(term);
    const phoneMatch = digits.length >= 3 && (g.phone||'').replace(/\D/g,'').includes(digits);
    return nameMatch || phoneMatch;
  }).slice(0, 8);
}

function renderMergeResults(sourceId){
  const box = document.getElementById('mergeResults');
  if(!box) return;
  if(state.mergeSearchTerm.trim().length === 0){ box.innerHTML = ''; return; }
  const matches = mergeCandidates(sourceId);
  if(matches.length === 0){
    box.innerHTML = `<p class="search-empty">No match yet — keep typing.</p>`;
    return;
  }
  box.innerHTML = matches.map(g => {
    const phoneTail = g.phone ? g.phone.slice(-4) : '';
    return `<div class="card clickable" data-mergetarget="${g.id}">
      <strong>${escapeHtml(g.name)}</strong>
      ${phoneTail ? `<div class="helptext" style="margin:2px 0 0">•••• ${phoneTail}</div>` : ''}
    </div>`;
  }).join('');
  box.querySelectorAll('[data-mergetarget]').forEach(el => {
    el.addEventListener('click', () => {
      if(el.dataset.confirming !== 'true'){
        el.dataset.confirming = 'true';
        el.querySelector('strong').textContent = 'Click again to confirm merge';
        setTimeout(() => {
          if(el.isConnected && el.dataset.confirming === 'true'){
            el.dataset.confirming = 'false';
            renderMergeResults(sourceId); // restore original label
          }
        }, 4000);
        return;
      }
      performMerge(sourceId, el.dataset.mergetarget);
    });
  });
}

function bindMergePanelEvents(){
  if(!state.mergeSourceId) return;
  const input = document.getElementById('mergeSearchInput');
  if(!input) return;
  input.focus();
  const val = input.value; input.value = ''; input.value = val; // cursor to end
  input.addEventListener('input', (e) => {
    state.mergeSearchTerm = e.target.value;
    renderMergeResults(state.mergeSourceId);
  });
  renderMergeResults(state.mergeSourceId);
  const cancelBtn = document.getElementById('mergeCancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', () => {
    state.mergeSourceId = null;
    state.mergeSearchTerm = '';
    renderGuestTable();
  });
}

async function performMerge(sourceId, targetId){
  const sourceGuest = state.guestList.find(g => g.id === sourceId);
  const targetGuest = state.guestList.find(g => g.id === targetId);
  if(!sourceGuest || !targetGuest) return;
  const sourceResponse = state.responses[sourceId];

  const mergedResponse = sourceResponse ? { ...sourceResponse, id: targetId } : null;
  if(mergedResponse){
    state.responses[targetId] = mergedResponse;
    delete state.responses[sourceId];
    targetGuest.weddingInvited = targetGuest.weddingInvited || !!mergedResponse.weddingAttending;
    targetGuest.receptionInvited = targetGuest.receptionInvited || !!mergedResponse.receptionAttending;
  }
  state.guestList = state.guestList.filter(g => g.id !== sourceId);
  state.mergeSourceId = null;
  state.mergeSearchTerm = '';
  renderGuestTable();

  try{
    if(mergedResponse) await withRetry(() => apiPost({ action: 'upsertResponse', response: mergedResponse, passcode: state.adminPasscode }));
    await withRetry(() => apiPost({ action: 'upsertGuest', guest: targetGuest, passcode: state.adminPasscode }));
    if(sourceResponse) await withRetry(() => apiPost({ action: 'deleteResponse', id: sourceId, passcode: state.adminPasscode }));
    await withRetry(() => apiPost({ action: 'deleteGuest', id: sourceId, passcode: state.adminPasscode }));
  }catch(err){
    console.error('Merge failed partway through:', err);
    // Rather than hand-unwind a partially-applied multi-step write, just
    // resync from the sheet so local state can't drift from what's saved.
    await loadAdminData();
    renderGuestTable();
    const errEl = document.getElementById('guestTableError');
    if(errEl) errEl.textContent = 'The merge only partly completed — data has been refreshed from the sheet. Please check this entry and try again.';
  }
}
